# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# --- PREREQUISITES ---------------------------------------------------------
#
# @n8n/node-cli >= 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step
# fails. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency.
#
# --- ONE-TIME SETUP --------------------------------------------------------
#
# There are two ways to authenticate. Both produce a provenance attestation,
# because provenance is signed by GitHub's OIDC infrastructure regardless of
# how npm itself authenticated the request.
#
# IMPORTANT: npm does not allow OIDC trusted publishing for a package's very
# first publish. The npmjs.com UI only shows "Trusted Publishers" once the
# package exists, so bootstrap with Option B, then switch to Option A.
# (Tracked upstream at https://github.com/npm/cli/issues/8544)
#
# Option B - bootstrap token (required once, for the first publish):
#   1. On npmjs.com: Access Tokens -> Generate New Token -> Granular Access
#      Token.
#   2. Permissions: "Read and write".
#   3. Under "Packages and scopes" select "Read and write (publish and stage)".
#      Do NOT pick "stage only": a stage-only token returns E_STAGE_REQUIRED
#      on direct publish and would need a manual 2FA promotion instead.
#   4. Turn ON "Bypass two-factor authentication". This is not optional and it
#      is the step that is easiest to miss. It defaults to OFF, and a token
#      without it fails the publish with:
#
#        403 Forbidden - PUT https://registry.npmjs.org/<pkg> -
#        Two-factor authentication or granular access token with bypass 2fa
#        enabled is required to publish packages.
#
#      A bypass-2FA token takes precedence over account- and package-level 2FA
#      settings, so it works whether or not the account has 2FA turned on.
#   5. Packages: select "All packages". You cannot scope the token to this
#      package because it does not exist on npm yet; this is the reason a
#      token is needed at all. Give it a short expiry (e.g. 7 days) - it only
#      has to survive the first publish.
#   6. In GitHub: Settings -> Secrets and variables -> Actions -> New secret.
#      Name it NPM_TOKEN and paste the token value.
#   7. Publish. The package now exists, so you can switch to Option A.
#
# Note: npm has announced that bypass-2FA tokens lose direct publish in
# January 2027, after which they can only stage a publish for a maintainer to
# approve. Treat Option B strictly as a bootstrap:
#   https://gh.io/npm-gat-bypass2fa-deprecation
#
# Option A - OIDC Trusted Publishing (recommended after the first publish):
#   1. Log in to npmjs.com and open this package's settings.
#   2. Under "Publish access" -> "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: kanjizoiie
#        Repository name:  n8n-nodes-charm-hyper
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Delete the NPM_TOKEN repository secret. GitHub's OIDC token is used
#      instead, so no long-lived credential stays in your repo settings.
#
# --- TAG CONVENTION --------------------------------------------------------
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# --- RELEASE PROCESS -------------------------------------------------------
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push - which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      # Actions are pinned to commit SHAs rather than mutable tags so the
      # publish path cannot be altered by a retagged or compromised release.
      #
      # actions/checkout v4.4.0
      # persist-credentials is disabled so the job's GITHUB_TOKEN is not left
      # behind in .git/config. The release step only publishes; it never pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        # package-manager-cache is disabled so no previously cached dependency
        # state can influence the artifact we publish to npm. Note this input
        # requires setup-node v6+ (v4 only has `cache`).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Publishes to npm with a provenance attestation (needs id-token:
        # write above). Lint and build run as part of the release process.
        #
        # If NPM_TOKEN is unset, the config line is skipped and npm uses the
        # OIDC exchange instead.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm refuses to generate a provenance attestation unless the publish
          # access is explicitly public, because it cannot infer publicness for
          # a package that does not exist on the registry yet. This is also set
          # in package.json (publishConfig.access); both are kept so neither a
          # config edit nor an env change can silently drop provenance.
          NPM_CONFIG_ACCESS: public
